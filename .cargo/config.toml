[alias]
# The asset pipeline: `cargo forge help` (docs/pipeline.md).
forge = "run --quiet --release --package forge --"
# The sandbox level: `cargo sandbox --help` (docs/development.md).
sandbox = "run --release --package cube_game --"

[env]
# Every binary loads from the one assets/ folder at the root.
BEVY_ASSET_ROOT = { value = ".", relative = true }
