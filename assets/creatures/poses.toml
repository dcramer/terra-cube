# What a pose must be, written down from looking at the animal, so that it is built to that
# and measured against it and not invented. The process, for any pose or motion:
#   1. Look: real photographs of the animal doing it, a dozen at once on one small sheet
#      (Wikimedia Commons has categories of them: `seen` says which were looked at).
#   2. Write here what makes it that pose, as things that can be measured on a skeleton.
#   3. Build it in forge (`crates/forge/src/walker.rs`), to these.
#   4. Forge measures what it built against these and says each in a line of
#      `cargo forge check` (`pose lie …`): ok, or FAIL and by how much.
#   5. Look at one sheet (`make moves ID=wolf lie`); write what was learned under `learned`,
#      and tighten or add a measure when the eye catches what the numbers passed.
# Lengths are parts of the creature's leg (hip to ground as it stands), angles degrees.

[lie]
what = "Lying awake on its chest, as a dog or a wolf does: chest and belly on the ground, back level, head up; elbows on the ground with the forearms flat and pointing ahead; each hind leg folded in a Z, the thigh ahead from the hip to a knee beside the belly, the shank back to a hock on the ground, the lower leg flat from hock to paw and pointing ahead; the tail on the ground."
seen = [
    "https://commons.wikimedia.org/wiki/Category:Lying_dogs (twelve at once, 2026-11-12: two black labradors and a white dog side-on show the legs plainly)",
]
# The chest's and the loins' lowest skin over the ground, each: on it, neither sunk nor held up.
belly = [-0.05, 0.08]
# Elbows and hocks: how far the joint may be over the ground, less its own thickness (a leg
# is not a line: laid down, its joint lies its own radius up; forge reads that off the skin).
elbow = 0.08
hock = 0.08
# How far any knee, hock or paw may be inside the trunk.
inside = 0.04
# Forearm and lower hind leg: how far from flat, and each paw ahead of its elbow or hock.
forearm = 20.0
lower_hind = 25.0
# Knee ahead of its hip, and the back within so many degrees of level.
back = 12.0
# The tail's lowest skin over the ground: on it or over it, not through it.
tail = -0.05
# The lowest skin of the whole animal over the ground: nothing of it is in the floor.
ground = -0.02
# And it is on the ground: the lowest of it (its tail apart) no further over it than this.
touch = 0.03
# State 2026-11-12, fitted as a whole: the bear and the boar-beast pass every measure and lie
# so. The wolf comes near and is not kept (its back 14 degrees from level, its hocks 10% over
# their thickness: its rump stays up); squirrel, goat and badger are further off. Each is said
# with its numbers by `FORGE_TRACE=1 cargo forge finish ID`, and `FORGE_KEEP=1` keeps a pose
# that fails so it can be looked at.
learned = [
    "The pose is fitted as a whole (`walker::lie`): six numbers searched together against every measure at once, on the skin. Placed part by part, each mend broke another measure.",
    "A leg has a thickness, read from the skin round each joint; elbows and hocks are measured over that, and legs are measured against the trunk so they cannot be hidden in it.",
    "Standing on its paws with the body let down is a squat, not lying (three tries).",
    "Legs folded to nothing under the hips go through the body.",
    "Legs stretched straight out ahead is not how anything lies.",
    "The body comes down until its belly is on the ground, by the skin of the trunk alone: by its legs' lengths a bear lay a hand deep in the floor, and by all its skin (legs and tail too) a wolf was held up off it.",
    "A leg is put down by the point of it that meets the ground: a rig may end at the hock.",
    "The chest and the loins are measured apart: by the lowest of the whole trunk the wolf's chest stood a hand over the ground with its loins on it, and every number passed. The eye caught it on the sheet; the measure was added.",
    "Nothing of it may be under the ground, and that is measured over all its skin: the paws of a wolf that passed every other measure were in the floor, and the developer saw it at a glance. A paw that points ahead standing points down when its leg is laid flat.",
    "The tail is measured too: it went through the floor behind a wolf that passed everything else.",
]
