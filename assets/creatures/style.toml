# The house style and the body plans, read by forge for every creature (docs/art-guide.md
# explains the rules; this file is how they are enforced). A concept prompt is
# "<creature subject>, <plan pose>, <style>".

style = """
stylized low-poly game creature, small bulky cartoony proportions with a slightly oversized head, \
chunky faceted planar forms, bold readable silhouette, simple large shapes with no small fiddly parts, \
hand-painted flat colour in a few saturated hues with one accent colour, soft stepped light-to-dark shading, \
no noise, no grain, no photorealism, no fur strands, no pure black, no pure white, \
single character, full body in frame, nothing held and nothing loose, \
plain light grey background, even studio light, no ground shadow"""

[tripo]
# Triangles asked of Tripo. Creatures share the screen with a voxel world; 8,000 holds a silhouette.
faces = 8000
texture_size = 1024
image_model = "nano-banana-2"
# 45 credits a model as measured 2026-11-09 (standard geometry and texture, colour only).
model_args = ["--geometry", "standard", "--texture-quality", "standard", "--no-pbr", "--smart-poly"]

[checks]
max_triangles = 12000
max_joints = 80
max_stretch = 0.6
max_foot_error = 0.08
max_loop_gap = 0.09
max_slide = 0.25

# What `cargo forge cubes` holds a figure rebuilt from cubes to. Each bar is for something first
# caught by eye; docs/pipeline.md (Cubes) says what to do about each FAIL.
[cubes]
min_tall = 10       # cubes; a shorter creature wants drawing for the grid, not converting
min_limb = 2        # cubes across the thinnest arm or leg
max_loose = 0.03    # cubes hanging on by one face or none: fingers, wisps, crumbs
max_speckle = 0.06  # surface cubes that share their colour with no neighbour

# Upright two-legged figures: the player and humanoid monsters. Tripo rigs these on one named
# skeleton (so gear and clips are shared) and has preset clips for them.
[plans.biped]
pose = "standing upright facing the camera in a T-pose, arms straight out to the sides, legs slightly apart, hands open and empty, front view"
rig = "humanoid"
skeleton = "mixamo"
upright = true
# The rest pose is a T-pose, so arms at the sides already read as stretch at the armpits.
max_stretch = 0.8
clips = ["idle", "walk", "run", "sprint", "jump", "fall", "land", "swim", "attack", "hurt", "die"]
# Tripo's `hurt` is a figure sat wounded on the ground for 14 s, not a flinch, and its `jump`
# is three hops on the spot, which no controller can use: ours are made.
[plans.biped.presets]
idle = "idle"
walk = "walk"
run = "run"
attack = "slash"
# `slash` is a slow two-handed overhead chop inside 6.6 s: keep the wind-up and blow, at double speed.
# Tripo's run is a jog (3.2 m/s on the player) and a sprint made by only quickening it had
# legs that spun without covering ground. Both get a longer stride instead: the feet travel
# this much further while down, at the cadence recorded.
[plans.biped.stride]
run = 1.25
sprint = 1.12
[plans.biped.trim]
attack = [0.9, 3.3, 2.0]

# Four-legged animals and monsters. Every clip is made (clips.rs).
[plans.quadruped]
pose = "standing still on all four legs in a neutral pose, seen from the side and slightly in front, all four legs straight and clearly separated, tail away from the legs, mouth closed"
rig = "other"
clips = ["idle", "walk", "run", "sprint", "jump", "fall", "land", "swim", "attack", "hurt", "die", "eat"]
# No presets: Tripo's one animal clip is a walk whose feet neither reach the ground nor hold
# still on it (measured: the planted foot moving at 90% to 180% of the body's speed). Walk,
# trot and gallop are made with planted feet instead (clips.rs `gait`).
