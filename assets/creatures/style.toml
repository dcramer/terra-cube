# The house style and the body plans, read by forge for every creature (docs/art-guide.md
# explains the rules; this file is how they are enforced). A concept prompt is
# "<creature subject>, <plan pose>, <style>".

style = """
stylized low-poly game creature, proportions true to the real animal with a head and eyes of natural size, \
lean and angular, alert and wary like a wild thing and never cute, a dangerous creature looks dangerous, \
chunky faceted planar forms, bold readable silhouette, simple large shapes with no small fiddly parts, \
hand-painted flat colour in a few muted natural hues with one accent colour, soft stepped light-to-dark shading, \
not cute, not chibi, not a toy, not a mascot, no big round eyes, no smile, \
no noise, no grain, no photorealism, no fur strands, no pure black, no pure white, \
single character, full body in frame, nothing held and nothing loose, \
plain light grey background, even studio light, no ground shadow"""

[tripo]
# Triangles asked of Tripo. Creatures share the screen with a voxel world; 8,000 holds a silhouette.
faces = 8000
texture_size = 1024
image_model = "nano-banana-2"
# 45 credits a model as measured 2026-11-09 (standard geometry and texture, colour only).
model_args = ["--geometry", "standard", "--texture-quality", "standard", "--no-pbr", "--smart-poly"]

[checks]
max_triangles = 12000
max_joints = 80
max_stretch = 0.6
max_foot_error = 0.08
max_loop_gap = 0.09
max_slide = 0.25

# What `cargo forge cubes` holds a figure rebuilt from cubes to. Each bar is for something first
# caught by eye; docs/pipeline.md (Cubes) says what to do about each FAIL.
[cubes]
min_tall = 10       # cubes; a shorter creature wants drawing for the grid, not converting
min_limb = 2        # cubes across the thinnest arm or leg
max_loose = 0.03    # cubes hanging on by one face or none: fingers, wisps, crumbs
max_speckle = 0.06  # surface cubes that share their colour with no neighbour
max_swallowed = 0.5 # of any arm or leg piece lost inside another part: an arm sunk in the body

# Upright two-legged figures: the player and humanoid monsters. Tripo rigs these on one named
# skeleton (so gear and clips are shared) and has preset clips for them.
[plans.biped]
pose = "standing upright facing the camera in a T-pose, arms straight out to the sides, legs slightly apart, hands open and empty, front view"
rig = "humanoid"
skeleton = "mixamo"
upright = true
# The rest pose is a T-pose, so arms at the sides already read as stretch at the armpits; and
# a sword stroke or a fall reads 81% to 98% on the heavy ones (goblin, troll, golem, shambler)
# and, drawn large, tears nothing (2026-11-12).
max_stretch = 1.0
clips = ["idle", "walk", "run", "sprint", "jump", "fall", "land", "swim", "attack", "hurt", "die"]
# Tripo's own `hurt` is a figure sat wounded on the ground for 14 s and its `jump` is skipping
# on the spot. The leap and the flinch are motions Tripo made from a description instead
# (2026-11-11, 20 credits each, once: `[plans.biped.motions]`), cut to the parts the game
# plays: leaving the ground, in the air, coming down.
[plans.biped.presets]
idle = "idle"
walk = "walk"
run = "run"
attack = "slash"
# Tripo's `fall` is a person staggering, going down and lying still, then getting up: all but
# the getting up is a death, and a better one than the made topple.
die = "fall"
jump = "a man crouches and jumps straight up"
fall = "a man crouches and jumps straight up"
land = "a man crouches and jumps straight up"
hurt = "a man standing is hit in the chest"
[plans.biped.trim]
# The library's sword stroke is a second and a half; the game's blow is one and lands a third
# of a second in.
attack = [0.2, 1.4, 1.3]
# The library's leap begins with a crouch, and the game's body is off the ground the moment
# the key is pressed: the leap is taken from where the feet leave. Its landing is a deep
# crouch and a slow rise, played faster.
jump = [0.15, 1.33, 1.0]
land = [0.05, 0.75, 2.0]
# Clips a person animated by hand (Quaternius's Universal Animation Library, CC0), carried
# onto the creature's own skeleton (`crates/forge/src/library.rs`; `tools/library.sh` fetches
# it). Taken before a preset of the same name.
[plans.biped.library]
idle = "Idle_Loop"
walk = "Walk_Loop"
run = "Jog_Fwd_Loop"
attack = "Sword_Attack"
jump = "Jump_Start"
fall = "Jump_Loop"
land = "Jump_Land"
sprint = "Sprint_Loop"
swim = "Swim_Fwd_Loop"
hurt = "Hit_Chest"
die = "Death01"

# What a described motion is called in the file (the start of its description) and its asset
# at Tripo, which goes on any humanoid for nothing once made.
[plans.biped.motions]
"a man crouches and jumps straight up" = "79006979-7587-49b6-8001-929f9a783f07"
"a man standing is hit in the chest" = "4771a4f0-4c39-4c4c-957b-9ae4c8372be4"

# A figure made and animated by hand, its own clips under our names, kept as they are: the
# library's own (`assets/creatures/mannequin`), to set ours beside.
[plans.authored]
pose = "none: not made at Tripo"
rig = "humanoid"
upright = true
max_stretch = 1.5
clips = ["idle", "walk", "run", "sprint", "jump", "fall", "land", "swim", "attack", "hurt", "die"]
[plans.authored.presets]
idle = "Idle_Loop"
walk = "Walk_Loop"
run = "Jog_Fwd_Loop"
sprint = "Sprint_Loop"
jump = "Jump_Start"
fall = "Jump_Loop"
land = "Jump_Land"
swim = "Swim_Fwd_Loop"
attack = "Sword_Attack"
hurt = "Hit_Chest"
die = "Death01"
[plans.authored.trim]
attack = [0.2, 1.4, 1.3]
jump = [0.15, 1.33, 1.0]
land = [0.05, 0.75, 2.0]

# A trial: a person moved by the two-legged walker (`cube_anim::biped`) and nobody's clips,
# on Tripo's own rig (`crates/forge/src/strider.rs`). Only what the walker can do yet.
[plans.strode]
pose = "standing upright facing the camera in a T-pose, arms straight out to the sides, legs slightly apart, hands open and empty, front view"
rig = "humanoid"
skeleton = "mixamo"
upright = true
max_stretch = 1.0
clips = ["idle", "walk", "run", "sprint"]

# A trial: what goes on four legs with our own skeleton, the walker's, put inside a bare mesh
# and skinned here (`crates/forge/src/own.rs`). Nothing of Tripo's rig is used: if the model
# comes with one it is taken off. Its clips are the walker's, joint for joint.
[plans.walked]
pose = "standing still on all four legs in a neutral pose, seen from the side and slightly in front, all four legs straight and clearly separated, tail away from the legs, mouth closed"
rig = "own"
max_stretch = 1.2
clips = ["idle", "walk", "run", "sprint", "lie"]

# Four-legged animals and monsters. Every clip is made (clips.rs).
[plans.quadruped]
pose = "standing still on all four legs in a neutral pose, seen from the side and slightly in front, all four legs straight and clearly separated, tail away from the legs, mouth closed"
rig = "other"
# A full stride stretches the skin at shoulder and hip well past the general bar and does not
# tear it: drawn large from the side, front and quarter at 70% to 103% (fox, deer, bear,
# 2026-11-11) the animals hold their shape. The 60% bar had their strides cut to as little as
# a twentieth (`gait_gain`), which is why they shuffled. A gallop carried from the library
# reads 113% to 115% on wolf and bear at full reach and holds as well (2026-11-12).
max_stretch = 1.2
clips = ["idle", "walk", "run", "sprint", "jump", "fall", "land", "swim", "attack", "hurt", "die", "eat", "lie"]
# What an animal does that a person drew: a wolf's (Quaternius, CC0), carried onto anything
# with four legs by its roles (`library.rs`). It has no trot: `run` is made.
[plans.quadruped.library]
idle = "Idle"
walk = "Walk"
sprint = "Gallop"
attack = "Attack"
hurt = "Idle_HitReact_Left"
die = "Death"
# Asleep on its side: where the wolf's fall ends, held (the wolf has no clip of lying down;
# its other two idles stand). Only for a creature whose `rests = "side"`.
lie = "Death"

# No presets: Tripo's one animal clip is a walk that marches nearly on the spot (looked at
# again 2026-11-11 beside ours: the legs lift well but the feet travel 0.14 to 0.27 m/s on a
# wolf). Walk, trot and gallop are made with planted feet instead (clips.rs `gait`).

# Birds: two legs, a beak, wings. Drawn with the wings held a little off the body so the rig
# gives them bones. They walk and hop for now: nothing in the simulation flies yet.
[plans.bird]
pose = "standing on both feet seen from the side and slightly in front, wings held slightly open and away from the body, legs clearly visible and apart, tail level, beak closed"
rig = "other"
clips = ["idle", "walk", "run", "jump", "fall", "land", "attack", "hurt", "die", "eat"]

# What flies, on the wing. Drawn from above with the wings spread flat and straight out, and
# not rigged at Tripo (its rig of a bird misnames every limb and cannot open a folded wing):
# forge gives it bones from its shape (`rig = "forge"`, crates/forge/src/shaped.rs). A
# creature of this plan gives its `span`, not its height.
[plans.flyer]
pose = "in flight seen from directly above, both wings fully spread flat and straight out to the sides, perfectly symmetrical, legs tucked up against the body, tail fanned straight back, head straight forward"
rig = "forge"
clips = ["fly", "glide", "perch"]
max_stretch = 2.5

# The same rig, for what beats its whole wing (a butterfly) and for what swims with its tail.
# These are models built here of boxes (`[built]` in creature.toml, crates/forge/src/built.rs).
[plans.flutterer]
pose = "built here"
rig = "forge"
clips = ["flutter", "glide"]
max_stretch = 2.5

[plans.swimmer]
pose = "built here"
rig = "forge"
clips = ["swim"]
max_stretch = 1.2

# Six legs or eight: insects, spiders, scorpions, crabs. Seen from above and to one side so
# every leg is drawn apart from the others.
[plans.crawler]
pose = "standing still seen from above and slightly to one side, every leg spread and clearly separated from the body and from each other, body level"
rig = "other"
clips = ["idle", "walk", "run", "jump", "fall", "land", "attack", "hurt", "die"]
