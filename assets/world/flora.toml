# The trees of the world, as data: read by `cube_sim::flora`. A new kind of tree is a new
# table here and nothing else: where it grows, how big, of what bark and leaf, and which of
# the habits it grows in (the habit is the one thing written in code, `cube_sim::plants`):
#
#   spreading  a short thick trunk forking low into heavy limbs, a broad dome (an oak)
#   slender    a thin swaying trunk, branches that rise and hang, a narrow open crown (a birch)
#   whorled    a straight tapering trunk, whorls of drooping boughs to a point (a pine)
#   weeping    short and thick, limbs arching out, leaf hanging in curtains (a willow)
#   dead       a broken trunk, a few limbs and stubs
#
# height   metres, from one just grown to an old one
# girth    how thick its trunk is at the foot (its radius), as a part of its height
# spread   how far its limbs reach beside the habit's usual (1): under 1 is a narrower tree
# reach    how far its crown shades the ground from its foot, as a part of its height
# bark, leaf, old_leaf   the blocks it is made of (old_leaf: what most old ones turn to)
# giant    whether one in twenty stands a quarter over its kind's tallest
# low, high, waterside   how common it is among the trees of low ground, of high ground
#          (over the conifer line, and on rock and snow) and beside water; a share of each

