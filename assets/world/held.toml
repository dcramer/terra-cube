# What is seen in a hand (`cube_game::held`). A thing is boxes, as everything is: each a size
# and a middle in metres and a colour, with the grip at the origin and the thing running
# along +y away from it. The grip is seated in the closed hand, the thing out past the thumb
# and facing (+x) the way the knuckles do (forge reads each model's hands: `[grip]` in its
# `meta.toml`); `turn` (degrees about x, y, z) and `shift` (metres) are from there; `aim` is
# which way it points as it is carried, in the body's frame; `droop` leaves the arm to the clip
# but keeps the forearm hanging (the most its direction's y may be); `light` is where a thing that lights gives its light from; `arm` is
# how the arm carries it where a clip's hanging arm would not do: the way the upper arm and
# the forearm point, in the body's frame (y up, +z ahead, +x his right); `sway` is how much of
# the clip's own swing of that arm is kept under it (0 to 1). `blow` is a blow with
# it where the clip's sword stroke will not do (the bow): the same two ways with the arm drawn
# back, then as the blow lands; `draw` the same for the other arm; `looses` the boxes that fly from it as the blow lands.
# Judge a change with `make held` (the thing through idle, walk, run and a blow).

["Short sword"]
turn = [0.0, 0.0, 0.0]
shift = [0.0, 0.0, 0.0]
# Carried low at his side on an arm that swings as it swings: only the forearm is kept from
# rising (on the arm as a run pumps it the blade went up past his face at every stride; held
# to a pose of its own, the whole arm was stiff and wrong). A blade stands across the forearm
# that grips it: with the forearm hanging it is forward, a little up and a little out.
droop = -0.82
aim = [0.15, 0.3, 0.94]
