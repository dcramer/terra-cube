# What is seen in a hand (`cube_game::held`). A thing is boxes, as everything is: each a size
# and a middle in metres and a colour, with the grip at the origin and the thing running
# along +y away from it. `turn` (degrees about x, y, z) and `shift` (metres) seat the grip in
# the right hand's bone; `light` is where a thing that lights gives its light from; `arm` is
# how the arm carries it where a clip's hanging arm would not do: the way the upper arm and
# the forearm point, in the body's frame (y up, +z ahead).
# Judge a change with `make held` (the thing through idle, walk, run and a blow).

