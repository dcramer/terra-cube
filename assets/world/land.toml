# What the land is made of and what grows on it, place by place: read by `cube_sim::cover`.
# Change the numbers here, or add a rule, and the world is made differently; no code places
# anything by a rule of its own.
#
# [density.BIOME]   how thick the standing things are: of the places a tree could stand (one
#                   to 6.5 m), the part that has one; of the places a small thing could (one
#                   to 3.5 m), the part with undergrowth and the part with a rock.
# [undergrowth]     of the undergrowth, the share that is each kind; and of young trees,
#                   the share that are conifers on low ground.
# [[ground]]        what the top of the soil is. The first rule that fits a place is taken.
# [[cover]]         what grows in the cell over it (`put = "none"`: nothing). First that fits.
#
# A rule fits where every test it gives holds:
#   biomes   which biomes it is for (meadow forest rock snow shore water)
#   trail    how worn by a trail the place is, between two numbers (0 none, 1 its middle)
#   shade    how far under a tree's crown, between two numbers (0 outside, 1 at the trunk)
#   foot     true: at the very foot of a trunk
#   needles  whether the crown over it is a conifer's
#   damp     how damp the ground is, between two numbers (forest grows over 0.5)
#   on       the block it stands on (cover only)
#   wet      whether it is at or under the water's level
#   slope    the steepest it may be, in cells to the next column
#   below    metres over the sea it must be under
#   patch    a slow noise must run over a number: `size` metres from patch to patch, `seed`
#            its own, `over` the number; `shade_eases` lowers that by so much per unit of shade
#   chance   a roll of the place must fall under this (the same roll for every rule, so
#            two chances in a row share it: 0.012 then 0.05 is 1.2% and 3.8%)
#   thick    the same roll must fall under (noise - minus) * times: thick in patches
#   pick     a second roll must fall under this, plus `bloom` (a patch noise, 0 to 1) * adds
#   scatter  a third roll must fall under this (times `bloom`, if the rule has one)
#   tall     cover only: it stands this many cells, from one number to the other

[density.forest]
trees = 0.8
under = 0.3
rocks = 0.02

[density.meadow]
trees = 0.09
under = 0.08
rocks = 0.03

[density.rock]
trees = 0.1
under = 0.02
rocks = 0.14

[density.snow]
trees = 0.04
under = 0.0
rocks = 0.09

[density.shore]
trees = 0.0
under = 0.0
rocks = 0.04

[undergrowth]
young = 0.25
bush = 0.53
log = 0.14
stump = 0.08
young_conifers = 0.25

# --- The top of the soil.

# A trail is bare earth; so is the very foot of a trunk.
[[ground]]
biomes = ["meadow", "forest"]
trail = [0.5, 1.0]
put = "dirt"

[[ground]]
biomes = ["meadow", "forest"]
foot = true
put = "dirt"

# Under a crown lie its leaves: a bed of needles under a conifer, drifts that thicken toward
# the trunk under anything else. So of a lone oak in a meadow as of a wood.
[[ground]]
biomes = ["meadow", "forest"]
shade = [0.12, 1.0]
needles = true
patch = { size = 3.5, seed = 82, over = 0.3 }
put = "litter"

[[ground]]
biomes = ["meadow", "forest"]
shade = [0.12, 1.0]
needles = false
patch = { size = 3.5, seed = 82, over = 0.66, shade_eases = 0.3 }
put = "litter"

# A forest floor: leaf drifts, moss where it is dampest, turf between.
[[ground]]
biomes = ["forest"]
patch = { size = 3.5, seed = 82, over = 0.6 }
put = "litter"

[[ground]]
biomes = ["forest"]
damp = [0.56, 1.0]
patch = { size = 6.0, seed = 83, over = 0.6 }
put = "moss"

[[ground]]
biomes = ["forest"]
put = "turf"

# A meadow: grass, with the odd scrape of bare earth.
[[ground]]
biomes = ["meadow"]
patch = { size = 4.0, seed = 84, over = 0.8 }
put = "dirt"

[[ground]]
biomes = ["meadow"]
put = "grass"

# A shore: sand, with beds of pebbles.
[[ground]]
biomes = ["shore"]
patch = { size = 5.0, seed = 85, over = 0.6 }
put = "gravel"

[[ground]]
biomes = ["shore"]
put = "sand"

# --- What grows over it.

# Nothing in a trail or against a trunk.
[[cover]]
biomes = ["meadow", "forest", "rock", "snow", "shore"]
trail = [0.3, 1.0]
put = "none"

[[cover]]
biomes = ["meadow", "forest", "rock", "snow", "shore"]
foot = true
put = "none"

# Long grass along a trail's edge, where nothing treads and nothing shades it.
[[cover]]
biomes = ["meadow"]
trail = [0.0001, 0.3]
chance = 0.4
put = "tuft"

[[cover]]
biomes = ["meadow"]
trail = [0.0001, 0.3]
put = "none"

# Under a lone tree the grass thins, and what likes shade comes up.
[[cover]]
biomes = ["meadow"]
shade = [0.35, 1.0]
chance = 0.012
put = "mushroom"

[[cover]]
biomes = ["meadow"]
shade = [0.35, 1.0]
chance = 0.05
put = "fern"

[[cover]]
biomes = ["meadow"]
shade = [0.35, 1.0]
thick = { size = 9.0, seed = 70, minus = 0.3, times = 0.65 }
put = "tuft"

[[cover]]
biomes = ["meadow"]
shade = [0.35, 1.0]
put = "none"

# The open meadow: long grass in patches, flowers in drifts some metres over, thick at the
# heart, and a few flowers anywhere a drift is.
[[cover]]
biomes = ["meadow"]
thick = { size = 9.0, seed = 70, minus = 0.3, times = 1.3 }
pick = 0.05
bloom = { size = 7.0, seed = 86, minus = 0.58, times = 6.0, adds = 0.5 }
put = "flower"

[[cover]]
biomes = ["meadow"]
thick = { size = 9.0, seed = 70, minus = 0.3, times = 1.3 }
put = "tuft"

[[cover]]
biomes = ["meadow"]
scatter = 0.14
bloom = { size = 7.0, seed = 86, minus = 0.58, times = 6.0, adds = 0.0 }
put = "flower"

# The forest floor: ferns in colonies with some long grass among them, ferns on the moss,
# mushrooms in troops on the litter and hardly one alone.
[[cover]]
biomes = ["forest"]
thick = { size = 9.0, seed = 70, minus = 0.34, times = 1.0 }
pick = 0.75
put = "fern"

[[cover]]
biomes = ["forest"]
thick = { size = 9.0, seed = 70, minus = 0.34, times = 1.0 }
put = "tuft"

[[cover]]
biomes = ["forest"]
on = "moss"
scatter = 0.07
put = "fern"

[[cover]]
biomes = ["forest"]
on = "litter"
patch = { size = 2.5, seed = 87, over = 0.72 }
pick = 0.16
put = "mushroom"

[[cover]]
biomes = ["forest"]
patch = { size = 2.5, seed = 87, over = 0.72 }
pick = 0.05
put = "mushroom"

[[cover]]
biomes = ["forest"]
scatter = 0.003
put = "mushroom"

# Woodland flowers: drifts in the glades of a wood, where no crown shades the ground. (Added
# as data alone, 2026-11-11: nothing in the code knows of it.)
[[cover]]
biomes = ["forest"]
shade = [0.0, 0.1]
patch = { size = 8.0, seed = 90, over = 0.68 }
pick = 0.3
put = "flower"

# Rock: ferns on the moss, grass in the cracks of low rock that is not steep.
[[cover]]
biomes = ["rock"]
on = "moss"
chance = 0.03
put = "fern"

[[cover]]
biomes = ["rock"]
slope = 1
below = 55.0
chance = 0.02
put = "tuft"

# The shore: reeds standing together at the water's edge, marram on the dry sand behind.
[[cover]]
biomes = ["shore"]
wet = true
chance = 0.4
patch = { size = 6.0, seed = 88, over = 0.5 }
tall = [2, 3]
put = "reed"

[[cover]]
biomes = ["shore"]
wet = false
on = "sand"
chance = 0.25
patch = { size = 5.0, seed = 89, over = 0.58 }
put = "tuft"
